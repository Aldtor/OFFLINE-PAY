[versions]
kotlin = "1.9.24"
agp = "8.5.2"
composeBom = "2024.06.00"
hilt = "2.51.1"
room = "2.6.1"
sqlcipher = "4.5.4"
mlkitBarcode = "17.3.0"
zxing = "3.5.3"
workmanager = "2.9.1"
firebaseBom = "33.1.2"
paging = "3.3.2"
navigation = "2.7.7"
lifecycle = "2.8.4"
coroutines = "1.7.3"
appcompat = "1.7.0"
javaxInject = "1"
serialization = "1.6.3"
camerax = "1.3.4"
turbine = "1.0.0"
kotest = "5.9.1"
mockk = "1.13.12"
junit5 = "5.10.3"
paparazzi = "1.3.4"
