# ── Memory tuning for low-RAM host (3.9 GB physical) ─────────────────────────
# This machine has only ~3.9 GB RAM. A 2 GB Gradle daemon plus a *separate*
# 2 GB Kotlin daemon cannot coexist with Windows + the IDE, which caused
# repeated JVM native-OOM crashes (hs_err_pid*.log: "mmap failed ... G1 virtual
# space"). Keep the Gradle daemon modest and run the Kotlin compiler in-process
# so no second JVM is forked.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.user.home=D:\\GradleHome
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.daemon=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ── R8 Full Mode (Task 2.3, Req 9.10) ────────────────────────────────────────
# Enables R8 full-mode for more aggressive obfuscation and shrinking in release builds.
# Full-mode performs global optimizations that standard R8 mode does not.
# All required keep rules are in app/proguard-rules.pro.
android.enableR8.fullMode=true
